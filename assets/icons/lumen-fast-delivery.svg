<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">توصيل سريع</title>
  <desc id="desc">أيقونة شاحنة توصيل متحركة باللون البرتقالي، بخطوط سرعة وعجلات تدور برفق.</desc>
  <style>
    :root { --lumen-orange: #F58216; }
    .outline { stroke:#F58216; stroke-width:3.6; stroke-linecap:round; stroke-linejoin:round; }
    .truck { transform-origin:64px 68px; animation: truck-ride 3.8s cubic-bezier(.4,0,.2,1) infinite; }
    .wheels { transform-box:fill-box; transform-origin:center; animation: wheel-turn 1.25s linear infinite; }
    .speed-1 { animation:speed 1.8s ease-in-out infinite; }
    .speed-2 { animation:speed 1.8s ease-in-out .16s infinite; }
    .speed-3 { animation:speed 1.8s ease-in-out .32s infinite; }
    .box-star { animation: shine 3.8s ease-in-out infinite; transform-origin:center; }
    @keyframes truck-ride { 0%,100%{transform:translate(0,0)} 14%{transform:translate(3px,-2px)} 31%{transform:translate(5px,0)} 45%{transform:translate(2px,-1px)} 60%,85%{transform:translate(0,0)} }
    @keyframes wheel-turn { to { transform:rotate(360deg); } }
    @keyframes speed { 0%,100%{opacity:.28;transform:translateX(0)} 30%{opacity:1;transform:translateX(-7px)} 65%{opacity:.2;transform:translateX(-12px)} }
    @keyframes shine { 0%,50%,100%{opacity:.45} 60%{opacity:1} 70%{opacity:.45} }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation:none !important; } .speed-1,.speed-2,.speed-3{opacity:.7} }
  </style>
  <g class="outline" stroke="#F58216">
    <g class="speed-1"><path d="M10 47h25"/></g>
    <g class="speed-2"><path d="M17 61h14"/></g>
    <g class="speed-3"><path d="M8 76h25"/></g>
  </g>
  <g class="truck outline" stroke="#F58216">
    <!-- Cargo silhouette -->
    <path d="M36 38h48a5 5 0 0 1 5 5v40H36a5 5 0 0 1-5-5V43a5 5 0 0 1 5-5Z"/>
    <path d="M89 54h12a7 7 0 0 1 5.7 2.9l11 15.6V83H89V54Z"/>
    <path d="M97 60h5l8 12H97V60Z"/>
    <path d="M36 83h81M104 83h13"/>
    <!-- Premium parcel mark -->
    <path d="M52 57 62 51l10 6v12l-10 6-10-6V57Z" stroke-width="2.6"/>
    <path d="m52 57 10 6 10-6M62 63v12" stroke-width="2.6"/>
    <path class="box-star" d="m62 47 1.3-3.5 1.3 3.5 3.5 1.3-3.5 1.3-1.3 3.5-1.3-3.5-3.5-1.3z" fill="#F58216" stroke="none"/>
    <!-- Wheels -->
    <circle cx="50" cy="84" r="10" fill="#FAF6ED"/>
    <circle cx="101" cy="84" r="10" fill="#FAF6ED"/>
    <g class="wheels"><path d="M50 79v10M45 84h10" stroke-width="2.3"/></g>
    <g class="wheels"><path d="M101 79v10M96 84h10" stroke-width="2.3"/></g>
    <path d="M40 38V33h42" stroke-width="2" opacity=".65"/>
  </g>
</svg>
