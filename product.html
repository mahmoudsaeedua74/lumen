<!DOCTYPE html>
<html lang="ar-SA" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>عطر | LUMEN</title>
    <meta name="description" content="تفاصيل عطر من مجموعة لومين." />
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/components.css" />
    <link rel="stylesheet" href="assets/css/layout.css" />
    <link rel="stylesheet" href="assets/css/product.css" />
    <link rel="stylesheet" href="assets/css/responsive.css" />
  </head>
  <body data-page="product">
    <a class="visually-hidden" href="#main" data-i18n="skip">تخطي إلى المحتوى</a>
    <div class="announcement" data-announcement><p data-announcement-text></p></div>
    <header class="site-header" data-site-header></header>

    <main id="main" class="container container--shop">
      <div data-product-page></div>
    </main>

    <div class="sticky-atc" data-sticky-atc hidden>
      <div class="sticky-atc__inner">
        <strong data-sticky-price></strong>
        <button class="btn btn--primary" type="button" data-sticky-add>أضف للسلة</button>
      </div>
    </div>

    <footer class="site-footer" data-site-footer></footer>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/i18n.js"></script>
    <script src="assets/js/products.js"></script>
    <script src="assets/js/cart.js"></script>
    <script src="assets/js/wishlist.js"></script>
    <script src="assets/js/toast.js"></script>
    <script src="assets/js/layout.js"></script>
    <script src="assets/js/navigation.js"></script>
    <script src="assets/js/components/product-card.js"></script>
    <script src="assets/js/components/cart-drawer.js"></script>
    <script src="assets/js/components/wishlist-drawer.js"></script>
    <script src="assets/js/components/product-gallery.js"></script>
    <script src="assets/js/pages/homepage.js"></script>
    <script src="assets/js/pages/product-page.js"></script>
    <script src="assets/js/main.js"></script>
  </body>
</html>
